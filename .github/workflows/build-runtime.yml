name: Build DSM AMDGPU Runtime

on:
  workflow_dispatch:
    inputs:
      platform:
        description: DSM platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - epyc7002
          - epyc7003
          - icelaked
          - r1000nk
          - v1000nk
          - geminilakenk
      dsm_version:
        description: DSM toolchain profile
        required: true
        default: '7.4'
        type: choice
        options:
          - '7.4'

permissions:
  contents: read

concurrency:
  group: amdgpu-runtime-${{ github.workflow }}-${{ inputs.platform }}-${{ inputs.dsm_version }}
  cancel-in-progress: false

jobs:
  prepare_matrix:
    name: Select platforms
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.matrix }}
    steps:
      - id: platforms
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          case "$SELECTED_PLATFORM" in
            all)
              echo 'matrix={"platform":["epyc7002","epyc7003","icelaked","r1000nk","v1000nk","geminilakenk"]}' >> "$GITHUB_OUTPUT"
              ;;
            epyc7002|epyc7003|icelaked|r1000nk|v1000nk|geminilakenk)
              printf 'matrix={"platform":["%s"]}\n' "$SELECTED_PLATFORM" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported platform: $SELECTED_PLATFORM" >&2
              exit 2
              ;;
          esac

  build:
    name: ${{ matrix.platform }} / DSM ${{ inputs.dsm_version }}
    needs: prepare_matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare_matrix.outputs.platforms).platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show available runner resources
        run: |
          nproc
          free -h
          df -h

      - name: Install host build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ca-certificates clang cmake curl \
            flex git glslang-tools libclang-dev libclc-14 libclc-14-dev libtool meson ninja-build \
            pkg-config python3 python3-mako python3-pip python3-yaml ruby xz-utils
          python3 -m pip install --break-system-packages 'meson==1.5.2'
          rustup target add x86_64-unknown-linux-gnu
          cargo install --locked bindgen-cli

      - name: Download selected Synology toolkit
        run: |
          ./scripts/provision-syno-toolchain.sh '${{ matrix.platform }}' '${{ inputs.dsm_version }}'

      - name: Fetch pinned upstream sources
        run: ./scripts/fetch-sources.sh

      - name: Build runtime and SPK
        run: |
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/work/toolchains/${{ matrix.platform }}/bin" \
          BUILD_BACKEND=host \
          COMPILE_JOBS="$(nproc)" \
          ./scripts/build-platform.sh '${{ matrix.platform }}' '${{ inputs.dsm_version }}'

      - name: Show result metadata
        if: always()
        run: |
          find dist -maxdepth 1 -type f -name '*.spk' -printf '%f %s bytes\n' 2>/dev/null || true
          find logs work/status -maxdepth 1 -type f -printf '%p\n' 2>/dev/null || true

      - name: Upload SPK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: syno-amdgpu-runtime-${{ inputs.dsm_version }}-${{ matrix.platform }}
          path: dist/syno-amdgpu-runtime-*-${{ inputs.dsm_version }}-${{ matrix.platform }}.spk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syno-amdgpu-build-logs-${{ inputs.dsm_version }}-${{ matrix.platform }}
          path: |
            logs/
            work/status/
          if-no-files-found: warn
          retention-days: 14
