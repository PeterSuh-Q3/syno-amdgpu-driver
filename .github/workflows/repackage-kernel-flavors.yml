# 목적: 이미 빌드된 x86_64 SPK 하나를 입력으로 받아, 패키지 통합 코드
# (postinst/start-stop-status/package-spk.sh 등)만 갱신한 kernel5.10.55 /
# kernel4.4.x 두 플레이버 SPK를 재패킹한다.
# Mesa/LLVM/amdgpu_top(Rust) 재컴파일은 전혀 하지 않으며, 헬퍼 C 파일
# (amdgpu-path-helper 등) 3종만 재컴파일한다. 0.4.0처럼 스크립트/버전만
# 바뀐 변경사항을 배포할 때 쓰는 경로다.
# 대응 스크립트: scripts/repackage-kernel-flavors.sh
#   (내부에서 scripts/repackage-existing-spk.sh -> scripts/package-spk.sh 순으로 호출)
#
# 전제조건: VM 호스트(45.228, Ubuntu 22.04)를 GitHub Actions 셀프 호스티드
# 러너로 등록하고 "syno-amdgpu-vm" 레이블을 부여해야 동작한다. GitHub이
# 제공하는 호스티드 러너에는 /opt/<platform> Synology 툴체인이 없다.
name: SPK 재패키징 (커널 플레이버 2종)

on:
  workflow_dispatch:
    inputs:
      existing_spk_path:
        description: "VM에 있는 기존 x86_64 .spk 파일의 절대 경로"
        required: true
        type: string
      platform:
        description: "DSM 플랫폼 (예: kvmx64)"
        required: true
        default: "kvmx64"
        type: string
      dsm_version:
        description: "DSM 툴체인 버전"
        required: true
        default: "7.4"
        type: string

permissions:
  contents: read

jobs:
  repackage:
    name: 커널 플레이버별 재패키징
    runs-on: [self-hosted, syno-amdgpu-vm]
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: repackage-kernel-flavors.sh 실행
        run: |
          ./scripts/repackage-kernel-flavors.sh \
            "${{ inputs.existing_spk_path }}" \
            "${{ inputs.platform }}" \
            "${{ inputs.dsm_version }}"

      - name: 산출물 업로드 (kernel5.10.55 / kernel4.4.x 각 1개)
        uses: actions/upload-artifact@v4
        with:
          name: repackaged-spk-${{ inputs.platform }}-${{ inputs.dsm_version }}
          path: dist/*.spk
          retention-days: 14
