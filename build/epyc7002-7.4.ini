[binaries]
c = '/opt/epyc7002/bin/x86_64-pc-linux-gnu-gcc'
cpp = '/opt/epyc7002/bin/x86_64-pc-linux-gnu-g++'
rust = ['rustc', '--target', 'x86_64-unknown-linux-gnu', '-C', 'linker=/opt/epyc7002/bin/x86_64-pc-linux-gnu-gcc']
ar = '/opt/epyc7002/bin/x86_64-pc-linux-gnu-ar'
strip = '/opt/epyc7002/bin/x86_64-pc-linux-gnu-strip'
pkgconfig = 'pkg-config'
llvm-config = '/work/scripts/llvm-config-epyc7002.sh'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
